name: Validar projeto e pacote

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Testar
        run: python -m unittest discover -s painel_migracao/tests -v
      - name: Gerar pacote limpo
        if: matrix.python == '3.12'
        run: python empacotar.py
      - name: Disponibilizar ZIP e SHA-256
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: migracao-bex-windows
          path: dist/*.zip*
          if-no-files-found: error
